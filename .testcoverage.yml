profile: coverage.out

threshold:
  file: 80
  package: 85
  total: 90

exclude:
  paths:
    # test-only package; it has no production code
    - ^internal/e2e
    # test-helper package: it is exercised by the pkg/rtmp, internal/ingest
    # and internal/e2e tests, which go test does not count towards it
    # without -coverpkg
    - ^pkg/rtmp/rtmptest
    # test-helper package: it is exercised by the pkg/rtsp and
    # internal/ingest tests, which go test does not count towards it
    # without -coverpkg
    - ^pkg/rtsp/rtsptest
    # test-helper package: it is exercised by the internal/metrics,
    # internal/stream, internal/api, internal/server and internal/e2e
    # tests, which go test does not count towards it without -coverpkg
    - ^internal/metrics/metricstest
    # cgo behind -tags libav, covered by the transcoder jobs; transcodetest
    # runs only in re-executed children
    - ^cmd/ostranscoder
    - ^internal/transcode/native
    - ^internal/transcode/transcodetest
