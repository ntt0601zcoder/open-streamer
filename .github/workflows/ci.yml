        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg \
            vlc-bin vlc-plugin-base vlc-plugin-access-extra \
            gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          cvlc --version | head -1
          gst-launch-1.0 --version | head -1
      - name: Check ffmpeg has SRT
        run: ffmpeg -hide_banner -protocols | grep -qx '  srt'
      # The RTSP peer of the TestM2c scenarios: MediaMTX 1.21.3 on the host
      # network, so that RTSP over UDP works, on private ports (RTSP 18554,
      # RTP 18000, RTCP 18001); the other servers, MoQ included, are off.
      # TestM3b1MediaMTXPull (OS_MEDIAMTX_PULL) has it pull our RTMP play
      # output, on demand, from the fixed port 19361 into the paths m3b1pull
      # (H.264+AAC) and m3b1pullhevc (H.265+AAC); TestM3b2MediaMTXPull has it
      # pull our RTSP play output, on demand and over TCP, from the fixed
      # port 19362 into the paths m3b2pull and m3b2pullhevc;
      # TestM3b3MediaMTXPull has it pull our HLS fMP4 and HLS TS outputs
      # from the fixed HTTP port 19364 (paths m3b3hls and m3b3hlsts) and
      # our SRT output from the fixed port 19363 (m3b3srt), on demand; and
      # TestM3VLCClass/push-out has it pull, on demand, the push-out's
      # target live/m3b3push from the RTMP MediaMTX above (path m3b3push).
      - name: Start MediaMTX for RTSP
        run: |
          docker run -d --rm --name osv2-mtx-m2c --network host \
            -e MTX_RTSPADDRESS=:18554 -e MTX_RTPADDRESS=:18000 -e MTX_RTCPADDRESS=:18001 \
