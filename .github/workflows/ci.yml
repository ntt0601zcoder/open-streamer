name: CI

on:
  pull_request:
    branches: [main, rebuild]

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy drift check
        run: |
          go mod tidy && git diff --exit-code -- go.mod go.sum

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      # The RTMP peer of TestRTMPMediaMTX and TestRTMPMediaMTXHEVC. Pinned to
      # 1.21.3, which reads and writes H.265 over enhanced RTMP (FourCC hvc1,
      # sent to clients that announce it in connect's fourCcList), so that a
      # new release cannot change the peer under the tests.
      mediamtx:
        image: bluenviron/mediamtx:1.21.3
        ports:
          - 1935:1935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check ffmpeg has SRT
        run: ffmpeg -hide_banner -protocols | grep -qx '  srt'
      - run: make test
        env:
          OS_REQUIRE_PEERS: "1"
          OS_MEDIAMTX_RTMP: 127.0.0.1:1935
          OS_REQUIRE_MEDIAMTX: "1"

  coverage:
    runs-on: ubuntu-latest
    services:
      # The RTMP peer of TestRTMPMediaMTX and TestRTMPMediaMTXHEVC. Pinned to
      # 1.21.3, which reads and writes H.265 over enhanced RTMP (FourCC hvc1,
      # sent to clients that announce it in connect's fourCcList), so that a
      # new release cannot change the peer under the tests.
      mediamtx:
        image: bluenviron/mediamtx:1.21.3
        ports:
          - 1935:1935
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check ffmpeg has SRT
        run: ffmpeg -hide_banner -protocols | grep -qx '  srt'
      - run: make cover covercheck
        env:
          OS_REQUIRE_PEERS: "1"
          OS_MEDIAMTX_RTMP: 127.0.0.1:1935
          OS_REQUIRE_MEDIAMTX: "1"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
