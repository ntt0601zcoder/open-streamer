            -e MTX_PATHS_M3B1PULLHEVC_SOURCE=rtmp://127.0.0.1:19361/live/m3b1pullhevc \
            -e MTX_PATHS_M3B1PULLHEVC_SOURCEONDEMAND=yes \
            -e MTX_PATHS_M3B2PULL_SOURCE=rtsp://127.0.0.1:19362/live/m3b2pull \
            -e MTX_PATHS_M3B2PULL_SOURCEONDEMAND=yes \
            -e MTX_PATHS_M3B2PULL_RTSPTRANSPORT=tcp \
            -e MTX_PATHS_M3B2PULLHEVC_SOURCE=rtsp://127.0.0.1:19362/live/m3b2pullhevc \
            -e MTX_PATHS_M3B2PULLHEVC_SOURCEONDEMAND=yes \
            -e MTX_PATHS_M3B2PULLHEVC_RTSPTRANSPORT=tcp \
            -e MTX_PATHS_M3B3HLS_SOURCE=http://127.0.0.1:19364/live/m3b3/cmaf/master.m3u8 \
            -e MTX_PATHS_M3B3HLS_SOURCEONDEMAND=yes \
            -e MTX_PATHS_M3B3HLSTS_SOURCE=http://127.0.0.1:19364/live/m3b3/hls/index.m3u8 \
            -e MTX_PATHS_M3B3HLSTS_SOURCEONDEMAND=yes \
            -e 'MTX_PATHS_M3B3SRT_SOURCE=srt://127.0.0.1:19363?streamid=live/m3b3srt' \
            -e MTX_PATHS_M3B3SRT_SOURCEONDEMAND=yes \
